name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: tony
          POSTGRES_USER: local_bootstrap
          POSTGRES_PASSWORD: local_bootstrap_only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U local_bootstrap -d tony"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql://tony_app:local_app_only@localhost:5432/tony
      MIGRATION_DATABASE_URL: postgresql://tony_migrator:local_migrator_only@localhost:5432/tony
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm install -g pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Initialize least-privilege local roles
        run: psql postgresql://local_bootstrap:local_bootstrap_only@localhost:5432/tony -v ON_ERROR_STOP=1 -f infra/postgres/init.sql
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm audit --prod --audit-level=high
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-results, path: test-results/ }
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d --wait app worker
      - run: curl --fail http://localhost:3000/readiness
      - run: docker compose logs
        if: failure()
      - run: docker compose down
        if: always()
