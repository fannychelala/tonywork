name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: tony
          POSTGRES_USER: local_bootstrap
          POSTGRES_PASSWORD: local_bootstrap_only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U local_bootstrap -d tony"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql://tony_app:local_app_only@localhost:5432/tony
      MIGRATION_DATABASE_URL: postgresql://tony_migrator:local_migrator_only@localhost:5432/tony
      AUTH_DATABASE_URL: postgresql://tony_auth:local_auth_only@localhost:5432/tony
      BETTER_AUTH_URL: http://127.0.0.1:3000
      AUTH_MAIL_MODE: local
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm install -g pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Initialize least-privilege local roles
        run: psql postgresql://local_bootstrap:local_bootstrap_only@localhost:5432/tony -v ON_ERROR_STOP=1 -f infra/postgres/init.sql
      - name: Generate ephemeral authentication secret
        run: node -e "const secret = require('crypto').randomBytes(32).toString('base64'); console.log('::add-mask::' + secret); require('fs').appendFileSync(process.env.GITHUB_ENV, 'BETTER_AUTH_SECRET=' + secret + '\n')"
      - name: Rehearse additive migration from Lot 2
        run: node scripts/check-crm-upgrade.mjs
        env:
          UPGRADE_BOOTSTRAP_URL: postgresql://local_bootstrap:local_bootstrap_only@localhost:5432/tony
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Verify dialog focus stability on desktop and mobile
        run: pnpm exec playwright test tests/e2e/shell-ui.spec.ts --repeat-each=3 --output=test-results/focus-stability
      - run: pnpm audit --prod --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-results, path: test-results/ }
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm install -g pnpm@11.25.0
      - name: Generate local Docker authentication secret
        run: node -e "require('fs').writeFileSync('.env', 'BETTER_AUTH_SECRET=' + require('crypto').randomBytes(32).toString('base64') + '\n', {mode:384})"
      - run: pnpm local:up
      - run: docker compose up -d --wait app worker
      - run: curl --fail http://localhost:3000/readiness
      - name: Require exact readiness HTTP 200
        run: test "$(curl --fail --silent --show-error --output /dev/null --write-out '%{http_code}' http://localhost:3000/readiness)" = "200"
      - name: Verify PostgreSQL volume survives stack restart
        run: |
          docker compose exec -T postgres psql -U local_bootstrap -d tony -v ON_ERROR_STOP=1 -c "INSERT INTO system_probe (id) VALUES ('restart-validation');"
          docker compose down
          docker compose up -d --wait app worker
          curl --fail http://localhost:3000/readiness
          test "$(curl --fail --silent --show-error --output /dev/null --write-out '%{http_code}' http://localhost:3000/readiness)" = "200"
          test "$(docker compose exec -T postgres psql -U local_bootstrap -d tony -Atc "SELECT count(*) FROM system_probe WHERE id = 'restart-validation';")" = "1"
          docker compose exec -T postgres psql -U local_bootstrap -d tony -v ON_ERROR_STOP=1 -c "DELETE FROM system_probe WHERE id = 'restart-validation';"
      - run: docker compose logs
        if: failure()
      - run: docker compose down
        if: always()
      - name: Verify stack is stopped
        if: always()
        run: test -z "$(docker compose ps --status running -q)"
